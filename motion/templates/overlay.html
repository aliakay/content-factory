<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<!--
  Text/graphic layers for bin/stylecut.py, drawn on a transparent canvas (1080x1920 or 1920x1080) at time t.
  Spec: #spec=<path under ~/tiktok to a JSON file> with {"w", "h", "band": {"top": px, "h": px} | null, "layers": [...]}.
  Layer: {type, start, end, text, kicker?, pos?, color?}
    title_serif  kicker line + big serif word(s), gold      ("EURO SUMMER / ITALY")
    title_bold   chunky display word, letters pop in         ("FREE", "ROAD TRIP / ICELAND")
    scramble     thin wide caps that decode letter by letter ("THE CANADIAN ROCKIES")
    editorial    stacked heavy sans, words land one by one   ("the beauty / of colour / grading")
    words        flowing serif words, each fades up on its beat (motivational lines)
    quote        small serif italic line, warm yellow        ("Let it bring you peace")
    pin          location pin + place name                   ("Varenna, Italy")
    hook         bold white two-line hook near the top
    caption      small lowercase subtitle (spoken phrase)
    window       full-frame matte with the word cut out: the footage shows only through huge letters, then the
                 letters grow until the footage fills the frame (L.color = matte colour, L.font = Anton|Playfair|...)
    html         a treatment the art director wrote for this video: L.html (markup), L.css, L.js = body of
                 function(root, p, t, L) called every frame (p = 0..1 through the layer); full frame, deterministic
  Every entrance/exit is a deterministic function of t (no CSS animations), so frames render the same every time.
-->
<style>
@font-face{font-family:Playfair;src:url(/fonts/PlayfairDisplay[wght].ttf)}
@font-face{font-family:PlayfairI;src:url(/fonts/PlayfairDisplay-Italic[wght].ttf)}
@font-face{font-family:Cormorant;src:url(/fonts/CormorantGaramond[wght].ttf)}
@font-face{font-family:CormorantI;src:url(/fonts/CormorantGaramond-Italic[wght].ttf)}
@font-face{font-family:Shrikhand;src:url(/fonts/Shrikhand-Regular.ttf)}
@font-face{font-family:Anton;src:url(/fonts/Anton-Regular.ttf)}
@font-face{font-family:Montserrat;src:url(/fonts/Montserrat[wght].ttf)}
@font-face{font-family:InterTight;src:url(/fonts/InterTight[wght].ttf)}
@font-face{font-family:Poppins;src:url(/fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Poppins;src:url(/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:InstrumentI;src:url(/fonts/InstrumentSerif-Italic.ttf)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0}
.layer{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;will-change:opacity,transform}
.shadow{text-shadow:0 2px 22px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const P = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
let SPEC = {layers: []};
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const lerp = (a, b, k) => a + (b - a) * k;
// fade in over `a`, hold, fade out over `b` before the end
function env(t, L, a = .35, b = .3) { return Math.min(easeOut((t - L.start) / a), 1 - easeIn((t - (L.end - b)) / b)); }

function yFor(L) {
  const band = SPEC.band, H = SPEC.h || 1920;
  const map = {top: .2, upper: .36, center: .5, lower: .64, bottom: .76};
  if (band && (L.pos || "center") === "center") return band.top + band.h / 2;
  // text on the black bars sits in the middle of the bar, at most 120 px from the picture
  if (band && L.pos === "above_band") return band.top - Math.min(120, band.top / 2);
  if (band && L.pos === "below_band") return band.top + band.h + Math.min(120, (H - band.top - band.h) / 2);
  return H * (map[L.pos || "center"] ?? .5);
}

function place(el, L, h) { el.style.top = (yFor(L) - h / 2) + "px"; el.style.height = h + "px"; el.style.justifyContent = "center"; }

const R = {
  title_serif(L, t) {
    const k = env(t, L, .8, .45), color = L.color || "#E8C77E";
    const rise = lerp(18, 0, easeOut((t - L.start) / 1.2));
    const big = Math.min(168, Math.floor(1500 / Math.max(4, (L.text || "").length)));
    return `<div class="layer shadow" data-h="420" style="opacity:${k};transform:translateY(${rise}px)">
      ${L.kicker ? `<div style="font:500 34px Playfair;letter-spacing:.32em;color:${color};text-transform:uppercase;margin-bottom:6px">${esc(L.kicker)}</div>` : ""}
      <div style="font:600 ${big}px/1 Playfair;letter-spacing:.06em;color:${color};text-transform:uppercase;white-space:nowrap">${esc(L.text)}</div>
      ${L.sub ? `<div style="font:28px CormorantI;letter-spacing:.08em;color:${color};margin-top:14px">${esc(L.sub)}</div>` : ""}</div>`;
  },
  title_bold(L, t) {
    const color = L.color || "#C8102E", lines = (L.text || "").split("\n");
    const size = Math.min(260, Math.floor(980 / Math.max(...lines.map(s => s.length)) * 1.55));
    let i = 0;
    const html = lines.map(line => `<div style="white-space:nowrap">${[...line].map(ch => {
      const d = L.start + (i++) * 0.045, p = easeOut((t - d) / .28);
      const s = lerp(1.35, 1, p), o = clamp((t - d) / .12) * (1 - easeIn((t - (L.end - .25)) / .25));
      return `<span style="display:inline-block;transform:scale(${s});opacity:${o}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
    }).join("")}</div>`).join("");
    return `<div class="layer" data-h="${size * lines.length + 40}" style="font:${size}px/0.95 Shrikhand;color:${color};
      text-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.35)">${html}</div>`;
  },
  scramble(L, t) {
    const target = (L.text || "").toUpperCase(), glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789asdjklm";
    const reveal = clamp((t - L.start) / Math.max(.9, target.length * .045));
    let out = "";
    for (let i = 0; i < target.length; i++) {
      const ch = target[i];
      if (ch === " " || i / target.length < reveal) out += ch === " " ? "&nbsp;" : esc(ch);
      else out += glyphs[Math.floor((t * 24 + i * 7) % glyphs.length)];
    }
    const o = 1 - easeIn((t - (L.end - .3)) / .3);
    const kick = L.kicker ? `<div style="font:500 26px Montserrat;letter-spacing:.2em;opacity:.9;margin-bottom:4px">${esc(L.kicker)}</div>` : "";
    return `<div class="layer shadow" data-h="220" style="opacity:${o};color:${L.color || "#fff"}">${kick}
      <div style="font:400 64px Montserrat;letter-spacing:.06em;white-space:nowrap;text-shadow:0 2px 26px rgba(0,0,0,.75),0 1px 4px rgba(0,0,0,.6)">${out}</div></div>`;
  },
  editorial(L, t) {
    const lines = (L.text || "").split("\n"); let i = 0;
    const o = 1 - easeIn((t - (L.end - .3)) / .3);
    const html = lines.map(line => `<div>${line.split(" ").map(w => {
      const d = L.start + (i++) * 0.22, p = easeOut((t - d) / .3);
      return `<span style="display:inline-block;opacity:${p};transform:translateY(${lerp(30, 0, p)}px)">${esc(w)}&nbsp;</span>`;
    }).join("")}</div>`).join("");
    return `<div class="layer shadow" data-h="${lines.length * 150 + 40}" style="opacity:${o};font:800 150px/0.88 InterTight;letter-spacing:-.05em;color:${L.color || "#fff"}">${html}</div>`;
  },
  words(L, t) {
    // the line flows in word by word across its span, alternating roman and italic for rhythm
    const ws = (L.text || "").split(/\s+/).filter(Boolean), n = ws.length;
    const span = Math.max(.6, Math.min(L.end - L.start - .6, n * .38));
    const o = 1 - easeIn((t - (L.end - .3)) / .3);
    const html = ws.map((w, i) => {
      const d = L.start + span * i / n, p = easeOut((t - d) / .35);
      const ital = i % 3 === 1;
      return `<span style="display:inline-block;margin:0 .14em;opacity:${p};filter:blur(${lerp(6, 0, p)}px);
        transform:translateY(${lerp(14, 0, p)}px);font:${ital ? "96px InstrumentI" : "92px Cormorant"};font-weight:${ital ? 400 : 500}">${esc(w)}</span>`;
    }).join("");
    return `<div class="layer shadow" data-h="420" style="opacity:${o};color:${L.color || "#fff"};padding:0 80px;
      flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;line-height:1.02">${html}</div>`;
  },
  quote(L, t) {
    const k = env(t, L, .6, .4);
    return `<div class="layer shadow" data-h="160" style="opacity:${k};padding:0 110px;font:500 54px/1.15 CormorantI;
      color:${L.color || "#F2D27A"}">${esc(L.text)}</div>`;
  },
  pin(L, t) {
    const p = easeOut((t - L.start) / .35), o = p * (1 - easeIn((t - (L.end - .25)) / .25));
    const pin = `<svg width="40" height="54" viewBox="0 0 24 32" style="margin-right:12px;transform:translateY(${lerp(-24, 0, p)}px)">
      <path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 32 12 32s12-11.2 12-20.1C24 5.3 18.6 0 12 0z" fill="#E53935"/>
      <circle cx="12" cy="11.5" r="4.6" fill="#fff"/></svg>`;
    return `<div class="layer shadow" data-h="120" style="opacity:${o};flex-direction:row;justify-content:center;
      font:700 52px Poppins;color:#fff;letter-spacing:-.01em">${pin}<span>${esc(L.text)}</span></div>`;
  },
  hook(L, t) {
    const k = env(t, L, .25, .25);
    return `<div class="layer" data-h="260" style="opacity:${k};padding:0 90px;font:700 56px/1.18 Poppins;color:#fff;
      text-shadow:0 3px 12px rgba(0,0,0,.55)">${esc(L.text)}</div>`;
  },
  window(L, t) {
    const W = SPEC.w || 1080, H = SPEC.h || 1920, p = clamp((t - L.start) / (L.end - L.start));
    const grow = Math.pow(clamp((p - .55) / .45), 3), size = Math.min(W * 1.5 / Math.max(2, (L.text || "").length), H * .3);
    return `<div class="layer" data-full="1" style="inset:0;display:block"><canvas width="${W}" height="${H}"></canvas>
      ${L.kicker ? `<div style="position:absolute;left:0;right:0;top:${H / 2 + size * .62}px;text-align:center;opacity:${1 - clamp(grow * 4)};
        font:500 30px Montserrat;letter-spacing:.4em;color:#f3efe6">${esc(L.kicker)}</div>` : ""}</div>`;
  },
  html(L, t) {
    return `<div class="layer" data-full="1" style="inset:0;display:block;text-align:left"><style>${L.css || ""}</style>${L.html || ""}</div>`;
  },
  caption(L, t) {
    const k = env(t, L, .12, .12);
    return `<div class="layer" data-h="90" style="opacity:${k};font:500 40px Poppins;color:${L.color || "#F5E663"};
      text-transform:lowercase;text-shadow:0 2px 8px rgba(0,0,0,.6)">${esc(L.text)}</div>`;
  },
};

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

window.ready = (async () => {
  SPEC = await (await fetch("/" + P.spec)).json();
  document.documentElement.style.width = document.body.style.width = (SPEC.w || 1080) + "px";
  document.documentElement.style.height = document.body.style.height = (SPEC.h || 1920) + "px";
  await document.fonts.ready;
  for (const f of ["Playfair", "PlayfairI", "Cormorant", "CormorantI", "Shrikhand", "Anton", "Montserrat", "InterTight", "Poppins", "InstrumentI"])
    await document.fonts.load(`40px ${f}`).catch(() => {});
})();

// window layer: matte with the word punched out, drawn on canvas so the zoom target is measured with the same engine
function drawWindow(cv, L, t) {
  const W = cv.width, H = cv.height, g = cv.getContext("2d"), raw = (L.text || "").toUpperCase(), font = L.font || "Anton";
  const p = clamp((t - L.start) / (L.end - L.start)), grow = Math.pow(clamp((p - .55) / .45), 3);
  const size = Math.min(W * 1.5 / Math.max(2, raw.length), H * .3);
  const word = (ctx) => { ctx.font = `${size}px ${font}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(raw, W / 2, H / 2); };
  if (L._ox === undefined) {   // thickest point of the ink: largest min(left, right, up, down) run inside the stroke
    const c = document.createElement("canvas"); c.width = W; c.height = H; const m = c.getContext("2d"); word(m);
    const y0 = Math.max(0, Math.round(H / 2 - size * .6)), hh = Math.min(H - y0, Math.round(size * 1.2));
    const img = m.getImageData(0, y0, W, hh).data, ink = (x, y) => img[(y * W + x) * 4 + 3] > 128;
    let best = null;
    for (let y = 2; y < hh - 2; y += 3) for (let x = 2; x < W - 2; x += 3) {
      if (!ink(x, y)) continue;
      let l = x, r = x, u = y, d = y;
      while (l > 0 && ink(l - 1, y)) l--; while (r < W - 1 && ink(r + 1, y)) r++;
      while (u > 0 && ink(x, u - 1)) u--; while (d < hh - 1 && ink(x, d + 1)) d++;
      const score = Math.min(x - l, r - x, y - u, d - y) - .02 * Math.abs(x - W / 2);
      if (!best || score > best.score) best = {score, x, y: y + y0};
    }
    L._ox = best ? best.x : W / 2; L._oy = best ? best.y : H / 2;
  }
  const sc = Math.exp(grow * Math.log(160)), k6 = clamp(grow * 6);   // exponential zoom reads as constant speed
  g.clearRect(0, 0, W, H);
  g.globalAlpha = 1 - clamp((p - .9) / .1);
  g.fillStyle = L.color || "#0b0b0c"; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = "destination-out";
  g.translate(lerp(L._ox, W / 2, k6), lerp(L._oy, H / 2, k6)); g.scale(sc, sc); g.translate(-L._ox, -L._oy);
  word(g); g.restore();
}

window.render = (t) => {
  const live = SPEC.layers.filter(L => t >= L.start && t < L.end && R[L.type]);
  stage.innerHTML = live.map(L => R[L.type](L, t)).join("");
  [...stage.children].forEach((el, i) => {
    const L = live[i];
    if (!el.dataset.full) place(el, L, Number(el.dataset.h || 200));
    if (L.type === "window") drawWindow(el.querySelector("canvas"), L, t);
    if (L.type === "html" && L.js) {
      try {
        L._fn = L._fn || new Function("root", "p", "t", "L", "clamp", "easeOut", "easeIn", "lerp", "{\n" + L.js + "\n}");  // block: its own const t/p may shadow the arguments
        L._fn(el, clamp((t - L.start) / (L.end - L.start)), t, L, clamp, easeOut, easeIn, lerp);
      } catch (e) { console.error("html layer: " + e.message); }
    }
  });
};
</script>
</body>
</html>
