<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'">
<!-- Shell for Opus-designed explainers (factory/motiondesign.py). The page loads a bundle.json (palette, scenes with
     html/css/js, scene + word timings), builds one paused GSAP master timeline and exposes window.render(t) for
     motion/render.mjs. Scene scripts only add tweens to `tl` at absolute times; nothing runs in real time.
     Network is blocked by the CSP above, so generated code cannot reach out. -->
<style>
@font-face{font-family:"Inter Tight";src:url("/fonts/InterTight%5Bwght%5D.ttf");font-weight:100 900}
@font-face{font-family:"Montserrat";src:url("/fonts/Montserrat%5Bwght%5D.ttf");font-weight:100 900}
@font-face{font-family:"Poppins";src:url("/fonts/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"Poppins";src:url("/fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:"Anton";src:url("/fonts/Anton-Regular.ttf")}
@font-face{font-family:"DM Serif Display";src:url("/fonts/DMSerifDisplay-Regular.ttf")}
@font-face{font-family:"Instrument Serif";src:url("/fonts/InstrumentSerif-Regular.ttf")}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url("/fonts/InstrumentSerif-Italic.ttf")}
@font-face{font-family:"Playfair Display";src:url("/fonts/PlayfairDisplay%5Bwght%5D.ttf");font-weight:400 900}
@font-face{font-family:"Cormorant Garamond";src:url("/fonts/CormorantGaramond%5Bwght%5D.ttf");font-weight:300 700}
@font-face{font-family:"Shrikhand";src:url("/fonts/Shrikhand-Regular.ttf")}
@font-face{font-family:"Monoton";src:url("/fonts/Monoton-Regular.ttf")}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg,#000);color:var(--ink,#fff);font-family:"Inter Tight",sans-serif}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
#cap{position:absolute;left:40px;right:40px;top:1540px;height:170px;display:flex;align-items:center;justify-content:center;text-align:center;
  font:900 84px/1.05 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:-.01em;color:var(--capInk,#fff);
  -webkit-text-stroke:14px var(--capStroke,#000);paint-order:stroke fill;z-index:50}
#cap b{font-weight:900;color:var(--capActive,var(--accent,#2ee6c5))}
#cap .k{color:var(--capKey,#b8ff3c)}
#cap .d{color:var(--capDanger,#ff453a)}
#cap b.k,#cap b.d{text-decoration:underline;text-decoration-thickness:8px;text-underline-offset:10px}
</style>
<div id="stage"><div id="cap"></div></div>
<script src="/motion/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/motion/templates/fxlib.js"></script>
<script>
const norm = (w) => String(w).toLowerCase().replace(/[^\p{L}\p{N}%$.]/gu, "");
let tl, B, chunks = [];
window.render = (t) => { if (tl) { tl.time(t, false); for (const f of FX._hooks) f(t); caps(t); } };
// sound + music cues the scenes declared (FX.sfx / FX.music), read by render.mjs --cues after setup
window.cues = () => ({ sfx: FX._cues, music: FX._music });
window.cutTimes = () => (B ? B.scenes.slice(1).map((s) => s.start) : []);   // render.mjs --blur keeps the shutter off the cuts
let CAP = { mode: "chunk", pos: "low", keys: {} };
window.ready = (async () => {
  const hash = new URLSearchParams(location.hash.slice(1));
  B = await (await fetch(hash.get("b"))).json();
  document.documentElement.lang = B.lang || "en";   // locale-aware text-transform (Turkish "biri" -> "BİRİ", not "BIRI")
  if (B.three !== false) {   // Three.js for scenes that build 3D with FX.three / FX.globe (deterministic, driven by render)
    try { window.THREE = await import("/motion/node_modules/three/build/three.module.min.js"); } catch (e) { console.error("three: " + e.message); }
  }
  FX._W = B.w || 1080; FX._H = B.h || 1920;   // the stage, for the kinetic kit
  if (B.bpm) { FX.BPM = B.bpm; FX.beat0 = B.beat0 || 0; }   // the music's beat grid: FX.B(k)
  const root = document.documentElement;
  for (const [k, v] of Object.entries(B.palette || {})) root.style.setProperty("--" + k, v);
  const stg = document.getElementById("stage"), capEl = document.getElementById("cap");
  if (B.w && B.h && B.w > B.h) {   // 16:9 canvas: wide stage, captions in a lower band
    stg.style.width = B.w + "px"; stg.style.height = B.h + "px";
    Object.assign(capEl.style, { top: "880px", height: "150px", left: "160px", right: "160px", fontSize: "68px",
                                 webkitTextStroke: "11px var(--capStroke,#000)" });
  }
  // captions: "chunk" (<=3 words, active word coloured) or "word" (one big word at a time); "low" band or "mid" frame;
  // keys = {word: "key"|"danger"} -> key words green, danger words red (story / horror captions)
  CAP = Object.assign(CAP, B.captions || {});
  if (CAP.pos === "mid") Object.assign(capEl.style, B.w > B.h ? { top: "640px" } : { top: "1080px", height: "220px" });
  if (CAP.mode === "word") capEl.style.fontSize = (B.w > B.h ? 92 : 118) + "px";
  const g = document.createElement("style"); g.textContent = B.global_css || ""; document.head.appendChild(g);
  const stage = document.getElementById("stage");
  gsap.ticker.lagSmoothing(0);
  tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  for (const sc of B.scenes) {
    const sec = document.createElement("section");
    sec.className = "scene"; sec.id = "s_" + sc.id; sec.innerHTML = sc.html || "";
    stage.insertBefore(sec, document.getElementById("cap"));
    const st = document.createElement("style"); st.textContent = `#s_${sc.id}{${sc.css || ""}}`; document.head.appendChild(st);
    const words = B.words.filter((w) => w.s >= sc.start - 0.1 && w.s < sc.end);
    const T = { id: sc.id, start: sc.start, end: sc.end, dur: sc.end - sc.start, words, lines: sc.lines_t || [],
      at: (word, fb = 0.3) => { const k = norm(word); const w = words.find((x) => norm(x.w) === k) || words.find((x) => k && norm(x.w).includes(k));
        return w ? w.s : sc.start + fb; } };
    tl.set(sec, { display: "block" }, sc.start);
    tl.set(sec, { display: "none" }, sc.end);
    FX._scene = sc.id;
    try { new Function("tl", "root", "T", "gsap", "$", "FX", sc.js || "")(tl, sec, T, gsap, (q) => sec.querySelectorAll(q), FX); }
    catch (e) { console.error("scene " + sc.id + " js: " + e.message); }
  }
  tl.set(document.getElementById("s_" + B.scenes[0].id), { display: "block" }, 0);
  // kinetic captions: <=3 words / <=16 chars, the active word in the accent colour
  let cur = [];
  const flush = () => { if (cur.length) chunks.push(cur); cur = []; };
  // group size by energy: high 2-3 words, talk 3-5, calm 4-6; a pause of 150 ms also breaks a group
  const [maxW, maxC] = CAP.mode === "word" ? [1, 16] : ({ high: [3, 16], talk: [4, 24], calm: [6, 30] }[CAP.energy] || [3, 16]);
  let prevEnd = null;
  for (const w of B.words) {   // like bin/explainer.py: also break after , . : ? ! so a chunk never spans two sentences
    if (cur.length && (cur.length >= maxW || cur.map((x) => x.w).join(" ").length + w.w.length > maxC || (prevEnd !== null && w.s - prevEnd >= 0.15))) flush();
    prevEnd = w.e;
    cur.push(w);
    if (/[,.:?!]$/.test(w.w)) flush();
  }
  flush();
  if (document.fonts) await document.fonts.ready;
})();
// layout lint (render.mjs --lint): every visible text run of the current scene with its tight box, colour and size
window.lintBoxes = () => {
  const out = [], vis = [...document.querySelectorAll("section.scene")].filter((s) => getComputedStyle(s).display !== "none");
  const opac = (el) => { let o = 1; for (let e = el; e && e.nodeType === 1; e = e.parentElement) { const cs = getComputedStyle(e); if (cs.visibility === "hidden" || cs.display === "none") return 0; o *= +cs.opacity; } return o; };
  for (const sec of vis) {
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      const txt = n.textContent.trim(), el = n.parentElement;
      if (!txt || !el || opac(el) < 0.35) continue;
      const r = document.createRange(); r.selectNodeContents(n); const b0 = r.getBoundingClientRect();
      // what is really visible: the text box clipped by every overflow-hidden ancestor (masked text reveals)
      let L = b0.left, T = b0.top, R = b0.right, Bt = b0.bottom, flip = false;
      for (let e = el; e && e !== document.body; e = e.parentElement) {
        const cs2 = getComputedStyle(e);
        if (cs2.backfaceVisibility === "hidden") flip = true;
        if (cs2.overflow !== "visible" || cs2.overflowX !== "visible") { const q = e.getBoundingClientRect(); L = Math.max(L, q.left); T = Math.max(T, q.top); R = Math.min(R, q.right); Bt = Math.min(Bt, q.bottom); }
      }
      const b = { left: L, top: T, width: R - L, height: Bt - T };
      if (b.width < 2 || b.height < 2) continue;
      const cs = getComputedStyle(el);
      out.push({ scene: sec.id.slice(2), text: txt.slice(0, 48), x: Math.round(b.left), y: Math.round(b.top), w: Math.round(b.width), h: Math.round(b.height), flip,
                 color: cs.color, size: parseFloat(cs.fontSize), clipText: cs.webkitBackgroundClip === "text" || cs.color === "rgba(0, 0, 0, 0)" });
    }
  }
  const cap = document.getElementById("cap"); const cb = cap.getBoundingClientRect();
  return { boxes: out, cap: cap.textContent.trim() ? { x: Math.round(cb.left), y: Math.round(cb.top), w: Math.round(cb.width), h: Math.round(cb.height) } : null };
};
// motion lint (render.mjs --readcheck): what the timeline itself says about the motion, per scene
window.lintMotion = () => {
  const out = [], SPATIAL = ["x", "y", "left", "top", "xPercent", "yPercent", "scale", "scaleX", "scaleY", "rotation"];
  const tweens = tl.getChildren(true, true, false);
  const sceneOf = (t) => B.scenes.find((s) => t >= s.start - 0.01 && t < s.end) || B.scenes[B.scenes.length - 1];
  const isText = (el) => el && el.nodeType === 1 && el.textContent.trim().length > 0 && !el.querySelector("svg,canvas,img");
  const active = {};
  for (const tw of tweens) {
    const st = tw.startTime(), d = tw.duration(), v = tw.vars || {}, sc = sceneOf(st + 0.001);
    const props = Object.keys(v).filter((k) => SPATIAL.includes(k));
    const ease = typeof v.ease === "string" ? v.ease : (tw.vars.ease && tw.vars.ease.name) || "";
    const targets = tw.targets ? tw.targets() : [];
    if (d > 0.04) (active[sc.id] = active[sc.id] || []).push([st, st + d]);
    if (props.length && d > 0.2 && /^(none|linear)/.test(ease) && !props.includes("rotation"))
      out.push({ kind: "linear", scene: sc.id, t: +st.toFixed(2), detail: `linear ease on ${props.join("/")} over ${d.toFixed(2)} s (spatial moves ease in and out)` });
    const stg = typeof v.stagger === "number" ? v.stagger : (v.stagger && v.stagger.each) || 0;
    if (stg && targets.length > 1 && stg * (targets.length - 1) > 0.6)
      out.push({ kind: "stagger", scene: sc.id, t: +st.toFixed(2), detail: `stagger runs ${(stg * (targets.length - 1)).toFixed(2)} s across ${targets.length} items (keep it under 0.5 s)` });
    if (props.some((k) => k.startsWith("scale") || k === "x" || k === "y") && d > 3.5 && targets.some(isText))
      out.push({ kind: "creep", scene: sc.id, t: +st.toFixed(2), detail: `text keeps moving for ${d.toFixed(1)} s after it lands (land it, then hold it still)` });
  }
  for (const sc of B.scenes) {   // dead stretches: > 3 s with no tween running and no per-frame drawing in the scene
    if (FX._hooks.some((f) => f.scene === sc.id)) continue;
    const iv = (active[sc.id] || []).map(([a, b]) => [Math.max(a, sc.start), Math.min(b, sc.end)]).filter(([a, b]) => b > a).sort((p, q) => p[0] - q[0]);
    let t = sc.start;
    for (const [a, b] of iv) { if (a - t > 3) out.push({ kind: "dead", scene: sc.id, t: +t.toFixed(2), detail: `${(a - t).toFixed(1)} s with nothing moving` }); t = Math.max(t, b); }
    if (sc.end - t > 3) out.push({ kind: "dead", scene: sc.id, t: +t.toFixed(2), detail: `${(sc.end - t).toFixed(1)} s with nothing moving at the end of the scene` });
  }
  for (const c of FX._cast || []) {   // characters: frozen between moves, or stopping dead at every pose
    const sc = B.scenes.find((s) => s.id === c.scene), t = sc ? +sc.start.toFixed(2) : 0;
    if (!c.man.live) out.push({ kind: "frozen", scene: c.scene, t, detail: "a character with no idle life between its moves: FX.alive(man) (gliding gaze, blinks, breathing, moving holds) or FX.emotions" });
    if ((c.man.poses || 0) >= 3 && !c.man.poseAt) out.push({ kind: "robot", scene: c.scene, t, detail: `${c.man.poses} FX.pose tweens: the body stops dead at every pose; chain them with FX.act(man, [[t, pose], ...]) so they flow` });
  }
  return out;
};
let lastKey = null;
function caps(t) {
  const el = document.getElementById("cap");
  const sc = B.scenes.find((s) => t >= s.start && t < s.end);
  let html = "", key = "";
  if (!(sc && sc.hide_captions)) {
    for (let i = 0; i < chunks.length; i++) {
      const c = chunks[i], nxt = chunks[i + 1];
      const a = c[0].s, b = nxt ? nxt[0].s : c[c.length - 1].e + 0.2;
      if (t >= a && t < b) {
        const act = c.reduce((k, w, j) => (t >= w.s ? j : k), 0);
        key = i + ":" + act;
        const role = (w) => ({ key: "k", danger: "d" }[CAP.keys[norm(w.w).replace(/\.+$/, "")]] || "");
        html = c.map((w, j) => { const r = role(w); return j === act ? `<b class="${r}">${w.w}</b>` : r ? `<span class="${r}">${w.w}</span>` : w.w; }).join(" ");
        break;
      }
    }
  }
  if (key !== lastKey) { el.innerHTML = html ? `<span>${html}</span>` : ""; lastKey = key; }
}
</script>
