<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0c10">
<title>Content Factory Studio</title>
<link rel="stylesheet" href="/static/app.css">
<script>try{const t=localStorage.getItem("cf.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <header class="mtop" id="mtop"></header>
    <main class="page" id="app"><div class="skel" style="height:220px"></div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="drawer" id="drawer"><div class="scrim" data-act="drawer"></div><div class="panel" id="drawerPanel"></div></div>
<div id="toast"></div>
<div class="modal" id="modal"><button class="x" data-act="closeModal">✕ Kapat</button><div class="box" id="modalBody"></div></div>
<div class="palette" id="palette"><div class="pbx"><input id="palQ" type="search" placeholder="Video, kanal, seri ya da sayfa ara…" autocomplete="off"><div class="res" id="palRes"></div></div></div>
<script src="/static/app.js"></script>
</body>
</html>
