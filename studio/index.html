<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Content Factory Stüdyo</title>
<style>
:root{
  --bg:#0e1014;--surface:#161920;--surface2:#1d212a;--line:#2a2f3b;--text:#e9ebf1;--muted:#8c94a8;--faint:#5d6477;
  --accent:#FFD93D;--accent-ink:#1a1600;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --s-idea:#a78bfa;--s-voice:#f472b6;--s-preview:#60a5fa;--s-ready:#4ade80;--s-published:#FFD93D;--s-rejected:#6b7280;
  --r:14px;--gap:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:1280px;margin:0 auto}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px}
.brand span{color:var(--accent)}
.jobpill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap}
.jobpill.on{color:var(--accent);border-color:#5c4f12}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;padding:7px 12px;border-radius:10px;color:var(--muted);white-space:nowrap;font-weight:500;font-size:14px}
nav a.on{background:var(--surface2);color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 80px;overflow-x:hidden}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:16px;margin:24px 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);padding:9px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;min-height:40px}
.btn:hover{border-color:#3a4150}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:#5a6275}
textarea{min-height:70px;resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.st-idea{--c:var(--s-idea)}.st-voice{--c:var(--s-voice)}.st-preview{--c:var(--s-preview)}.st-ready{--c:var(--s-ready)}.st-published{--c:var(--s-published)}.st-rejected{--c:var(--s-rejected)}
.stage{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.stage .dot{background:var(--c)}
.thumb{width:54px;height:96px;border-radius:9px;object-fit:cover;background:var(--surface2);flex:none}
.pcard{display:flex;gap:12px;align-items:flex-start;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:#3a4150}
.pcard .t{font-weight:600;line-height:1.3}
.pcard .h{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:transparent;min-width:230px}
.col>.hd{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;font-size:14px}
.col .list{display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.fmt{cursor:pointer;position:relative}
.fmt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fmt.off{opacity:.5;cursor:default}
.fmt .n{font-weight:650}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.stepper{display:flex;gap:0;margin:6px 0 14px;overflow-x:auto}
.stepper div{flex:1;min-width:76px;text-align:center;font-size:12px;color:var(--faint);padding-top:10px;border-top:3px solid var(--line)}
.stepper div.done{color:var(--muted);border-color:#4b5263}
.stepper div.cur{color:var(--c);border-color:var(--c);font-weight:650}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:960px){.detail{grid-template-columns:minmax(0,1fr)}.detail>div:last-child{order:-1}.board{grid-template-columns:repeat(5,82vw)}}
video{width:100%;max-height:72vh;border-radius:12px;background:#000;display:block}
.vwrap{max-width:380px;margin:0 auto}.vwrap.wide{max-width:none}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.shot{flex:none;width:118px}
.shot img{width:118px;height:210px;object-fit:cover;border-radius:10px;background:var(--surface2);display:block}
.shot .m{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.shot .tx{font-size:12px;margin-top:3px}
.tl{position:relative;height:46px;border-radius:9px;overflow:hidden;background:var(--surface2);margin:8px 0 4px}
.tl .seg{position:absolute;top:0;height:24px;border-right:2px solid var(--bg);background:#2c3342}
.tl .seg:nth-child(odd){background:#343c4e}
.tl .txt{position:absolute;top:27px;height:16px;border-radius:4px;background:color-mix(in srgb,var(--accent) 70%,transparent)}
.lines{display:grid;gap:6px}
.lines input{padding:8px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv>div:nth-child(odd){color:var(--muted)}
.warnbox{border-color:#5c4612;background:#211b0c}
.errbox{border-color:#5c1f1f;background:#211010}
.okbox{border-color:#1f4d2e;background:#0f1d14}
pre.log{background:#0a0c0f;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;margin:8px 0 0;color:#b9c0d0}
.hist{display:grid;gap:8px;font-size:13px}
.hist div{display:flex;gap:10px}
.hist time{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.lib{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.lib img{width:100%;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:10px;background:var(--surface2);display:block;cursor:pointer}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#262b36;border:1px solid #3a4150;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.on{opacity:1}#toast.bad{border-color:#7f2a2a;color:#fecaca}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.modal video{max-height:78vh;width:auto;max-width:100%}
.modal .xbtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:41;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.spark{display:block}
.sec{margin-top:14px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.flow b{padding:5px 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
@media(max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv>div:nth-child(odd){font-size:12px;margin-top:8px}}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--faint);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">🎬 Content Factory <span>Stüdyo</span></div>
    <div id="jobpill" class="jobpill" onclick="location.hash='#/'">işler: —</div>
    <div id="mechip" class="jobpill" style="margin-left:6px;display:none" onclick="location.hash='#/hesaplar'"></div>
  </div>
  <nav id="nav">
    <a href="#/">Pano</a><a href="#/uret">Üret</a><a href="#/hat">Üretim hattı</a><a href="#/takip">Takip</a>
    <a href="#/videolar">Videolar</a><a href="#/referanslar">Referanslar</a><a href="#/ses">Ses & Avatar</a><a href="#/akislar">Akışlar</a><a href="#/kesif">Keşif</a><a href="#/sinyal">Sinyaller</a><a href="#/butce">Bütçe</a><a href="#/hesaplar">Hesaplar</a>
  </nav>
</header>
<main id="app"></main>
<footer>Shorts Paneli: <a id="lnk-shorts" href="#" target="_blank">:8095</a> · Eski panel (klipler, Reference Lab): <a id="lnk-old" href="#" target="_blank">:8503</a></footer>
<script>for(const[id,p]of[["lnk-shorts",8095],["lnk-old",8503]])document.getElementById(id).href=`${location.protocol}//${location.hostname}:${p}`</script>
<div id="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><button class="xbtn" onclick="closeModal()">✕ Kapat</button><div id="modalBody"></div></div>
<script>
const STAGES=[["idea","Fikir"],["voice","Ses"],["preview","Önizleme"],["ready","Hazır"],["published","Yayında"],["rejected","Reddedildi"]];
const SL=Object.fromEntries(STAGES);
const PL={youtube:"YouTube",tiktok:"TikTok",instagram:"Instagram"};
const JOBTR={p_ideas:"fikir üretimi",p_voice:"ses + önizleme",p_preview:"önizleme",p_render:"final render + QA",p_revise:"revizyon",p_design:"hareket tasarımı",p_verify:"doğrulama",ingest:"albüm indirme",analyze:"analiz",describe:"klip açıklama",radar:"radar",trends:"trendler",yt_stats:"YouTube istatistik",ref_lib:"referans analizi",discover:"günlük keşif",style_extract:"stil çıkarma",avatar_check:"avatar kontrolü",p_music:"müzik + önizleme",refs:"Reference Lab",ideas:"fikir (eski)",render:"render (eski)",preview:"önizleme (eski)",verify:"doğrulama (eski)"};
let STYLES=[];const LOOKS=()=>[["auto","✨ Otomatik · Opus kendisi bulsun (araştırır, 3 yön önerir)"],["tech","🌌 Tech · koyu lacivert, neon vurgu"],["paper","📰 Paper · Vox tarzı krem kâğıt, sarı vurgu"],...STYLES.map(x=>["custom:"+x.id,"🎨 "+x.id])];
async function uploadStyle(inp){const f=inp.files[0];if(!f)return;const note=prompt("Bu referanstan ne alınsın? (ör. sadece renkler) — boş bırakabilirsin")||"";try{const r=await fetch("/api/refs/upload",{method:"POST",headers:{"X-Studio":"1","X-Style":"1","X-Filename":encodeURIComponent(f.name),"X-Style-Note":encodeURIComponent(note)},body:f});const j=await r.json();if(!r.ok)throw new Error(j.error);toast("Stil çıkarılıyor (#"+j.job_id+"), ~1 dk");setTimeout(async()=>{STYLES=await api("/api/styles");route()},70000)}catch(e){toast(e.message,1)}}
let FORMATS=[],timer=null,state={gen:{format:null,places:[],n:3,brief:"",refs:[],voice:null,aspect:"9:16"}};
const ASPECT_TR={"9:16":"Dikey 9:16","16:9":"Yatay 16:9"};
function aspectChips(cur,onpick){return ["9:16","16:9"].map(a=>`<span class="chip ${cur===a?"on":""}" onclick="${onpick(a)}"><span style="display:inline-block;vertical-align:-3px;margin-right:6px;border:2px solid currentColor;border-radius:3px;width:${a==="9:16"?10:18}px;height:${a==="9:16"?18:10}px"></span>${ASPECT_TR[a]}</span>`).join("")}
const THEME_TR={gezi:"Gezi",vlog:"Vlog",manzara:"Manzara",motivasyon:"Motivasyon","diğer":"Diğer"};
const LAYER_TR={title_serif:"serif başlık",title_bold:"kalın başlık",scramble:"şifreli başlık",editorial:"editoryal",words:"akan kelimeler",quote:"alıntı",pin:"konum pini",hook:"hook",caption:"altyazı"};
const GRADE_TR={natural:"doğal",film:"film",golden:"altın",moody:"moody",vivid:"canlı",mono:"siyah-beyaz"};
const FRAME_TR={full:"tam ekran",letterbox:"sinema bandı 16:9",scope:"geniş bant 2.39"};
function refThumb(id){return "/thumb/ref?id="+encodeURIComponent(id)}
function recipeChips(r){const x=(r.recipe||{}).recipe||{};return [x.frame&&FRAME_TR[x.frame],x.grade&&("renk: "+(GRADE_TR[x.grade]||x.grade)),x.pace&&(x.pace==="beat"?"beat'e kesme":"sakin tempo"),...(x.layers||[]).map(l=>LAYER_TR[l.type]||l.type)].filter(Boolean).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>n==null?"—":Number(n).toLocaleString("tr-TR");
const sec=s=>s==null?"—":(Math.round(s*10)/10).toLocaleString("tr-TR")+" sn";
function ago(iso){if(!iso)return"";const d=(Date.now()-new Date(iso))/1000;if(d<60)return"az önce";if(d<3600)return Math.floor(d/60)+" dk önce";if(d<86400)return Math.floor(d/3600)+" sa önce";return Math.floor(d/86400)+" gün önce"}
function dt(iso){return iso?new Date(iso).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):""}
function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(t._t);t._t=setTimeout(()=>t.className="",3500)}
async function api(p){const r=await fetch(p);if(r.status===401){location.href="/login";return new Promise(()=>{})}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
async function post(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json","X-Studio":"1"},body:JSON.stringify(b||{})});if(r.status===401){location.href="/login";return new Promise(()=>{})}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
function stageBadge(s){return `<span class="badge stage st-${s}"><i class="dot"></i>${SL[s]||s}</span>`}
function fmtName(id){const f=FORMATS.find(x=>x.id===id);return f?f.name_tr:id}
function thumbUrl(clip,t){return clip?`/thumb/clip/${encodeURIComponent(clip)}?t=${t||0}`:""}
function copy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{navigator.clipboard?navigator.clipboard.writeText(text).catch(()=>document.execCommand("copy")):document.execCommand("copy")}catch(e){}ta.remove();toast("Kopyalandı")}
function openVideo(src,photo){$("#modalBody").innerHTML=photo?`<img src="${src}" style="max-width:100%;max-height:85vh;border-radius:10px" alt="">`:`<video src="${src}" controls autoplay playsinline></video>`;$("#modal").classList.add("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function closeModal(){$("#modal").classList.remove("on");$("#modalBody").innerHTML=""}
function poll(fn,ms){clearTimeout(timer);timer=setTimeout(function again(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value){timer=setTimeout(again,ms);return}fn()},ms)}
function spark(h){if(!h||h.length<2)return"";const v=h.map(x=>x.views),mx=Math.max(...v),mn=Math.min(...v),W=90,H=24;const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-2-(mx===mn?0.5:(y-mn)/(mx-mn))*(H-4)).toFixed(1)}`).join(" ");return `<svg class="spark" width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>`}

function pcard(p,extra){
  return `<a class="card pcard" href="#/p/${p.prod_id}">
    ${p.thumb?`<img class="thumb" loading="lazy" src="${thumbUrl(p.thumb,p.thumb_t)}" alt="">`:`<div class="thumb" style="display:grid;place-items:center">🎬</div>`}
    <div style="min-width:0;flex:1">
      <div class="t">${esc(p.title)}</div>
      <div class="h">${esc(p.hook||"")}</div>
      <div class="row" style="margin-top:6px;gap:6px">${stageBadge(p.stage)}<span class="badge">${esc(fmtName(p.format))}</span>${p.duration?`<span class="badge">${sec(p.duration)}</span>`:""}${p.aspect==="16:9"?`<span class="badge">yatay</span>`:""}</div>
      ${p.busy?`<div class="small" style="color:var(--accent);margin-top:6px"><span class="spin"></span> ${esc(JOBTR[p.busy.kind]||p.busy.kind)} sürüyor</div>`:""}
      ${extra||""}
    </div></a>`}

// ---------------- views ----------------
async function viewPano(){
  const o=await api("/api/overview");
  const b=o.budget,pct=Math.min(100,b.spent/b.cap*100);
  const pend=o.pending.length?o.pending.map(p=>pcard(p,`<div class="small" style="margin-top:6px">👉 ${esc(p.next)}</div>`)).join(""):`<div class="empty">Şu an senden bekleyen bir şey yok. <a href="#/uret">Yeni fikir üret →</a></div>`;
  const jobs=o.jobs.map(j=>`<div class="card" style="padding:10px 12px">
    <div class="row small"><b>#${j.job_id}</b><span>${esc(JOBTR[j.kind]||j.kind)}</span><span class="sp"></span>
    ${j.status==="running"||j.status==="queued"?'<span style="color:var(--accent)"><span class="spin"></span> sürüyor</span>':j.status==="failed"?'<span style="color:var(--bad)">hata</span>':'<span class="muted">bitti</span>'}
    <span class="faint tiny">${ago(j.finished_at||j.started_at)}</span></div>
    ${j.result?`<div class="tiny muted" style="margin-top:4px">${esc(j.result)}</div>`:""}
    ${j.tail&&j.status!=="done"?`<pre class="log">${esc(j.tail)}</pre>`:""}</div>`).join("");
  const c=o.counts;
  $("#app").innerHTML=`
  <h1>Pano</h1>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Bu ay biten video</div><div class="v">${o.made_this_month}</div></div>
    <div class="card kpi"><div class="l">Takip edilen paylaşım</div><div class="v">${o.tracking.posts}</div></div>
    <div class="card kpi"><div class="l">Toplam izlenme (takip)</div><div class="v">${num(o.tracking.total_views)}</div></div>
    <div class="card kpi"><div class="l">ElevenLabs kredisi · bu ay / ${num(b.cap)}</div><div class="v">${num(b.spent)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
  </div>
  <h2>Üretim hattı</h2>
  <div class="chips">${STAGES.map(([k,l])=>`<a class="chip" href="#/hat" style="text-decoration:none"><span class="badge stage st-${k}" style="border:0;padding:0"><i class="dot"></i></span> ${l} · <b>${c[k]||0}</b></a>`).join("")}</div>
  <h2>Senden bekleyenler</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${pend}</div>
  <h2>İşler</h2>

async function applyPlan(id){const steps=[...document.querySelectorAll(".pstep:checked")].map(i=>i.value);if(!steps.length)return toast("En az bir adım seç",1);
  if(steps.includes("script")&&!steps.includes("design")&&!confirm("Metin değişince sahneler yeniden tasarlanır (tasarım otomatik eklenir). Devam?"))return;
  await act(id,'apply_plan',{steps})}

function qaBox(q){if(!q)return"";const t=q.technical||{},v=q.visual||{};

async function setAspect(id,a){if(document.querySelector(".spin")&&!confirm("Bu video için bir iş sürüyor. Yine de kadrajı değiştir?"))return;
  try{const r=await post(`/api/production/${id}/action`,{action:"set_aspect",aspect:a});toast(r.redirect?"Yeni kopya açıldı, önizleme hazırlanıyor":"Kadraj değişti");if(r.redirect)location.hash="#/p/"+r.redirect;else route()}catch(e){toast(e.message,1)}}
async function delProd(id){if(!confirm("Bu üretim ve tüm dosyaları kalıcı olarak silinsin mi? Geri alınamaz."))return;try{const r=await post(`/api/production/${id}/action`,{action:"delete"});toast("Silindi · "+r.freed_mb+" MB boşaldı");location.hash="#/hat"}catch(e){toast(e.message,1)}}
async function delVideo(f){if(!confirm("“"+f+"” videosu diskten silinsin mi? Geri alınamaz."))return;try{const r=await post("/api/library/delete",{folder:f});toast("Silindi · "+r.freed_mb+" MB boşaldı");route()}catch(e){toast(e.message,1)}}
async function delRef(id){if(!confirm("Bu referans dosyası ve analizi silinsin mi? Geri alınamaz."))return;try{const r=await post("/api/refs/delete",{ref_id:id});toast("Silindi · "+r.freed_mb+" MB boşaldı");route()}catch(e){toast(e.message,1)}}
async function act(id,action,extra){try{await post(`/api/production/${id}/action`,{action,...(extra||{})});toast("Tamam");route()}catch(e){toast(e.message,1)}}
async function saveEdits(id,voice){const edit={title:$("#e_title").value,hook:$("#e_hook").value,caption:$("#e_caption").value,hashtags:$("#e_tags").value,location:$("#e_loc").value,music:$("#e_music").value};
  if($("#e_end"))edit.end_card=$("#e_end").value;
  if(voice)edit.voice_lines=[...document.querySelectorAll("#vlines input")].map(i=>i.value);
  else edit.shot_texts=[...document.querySelectorAll("#stexts input")].map(i=>i.value);
  act(id,"save",{edit})}

  $("#app").innerHTML=`<div class="row"><h1 style="margin:0">Sinyaller</h1><span class="sp"></span>
    <a class="chip ${prof==="travel"?"on":""}" href="#/sinyal?p=travel" style="text-decoration:none">Seyahat</a><a class="chip ${prof==="psychology"?"on":""}" href="#/sinyal?p=psychology" style="text-decoration:none">Psikoloji</a></div>
  <div class="row sec"><span class="small muted">YouTube Radar · son çalışma ${r?dt(r.ts)+" · "+r.status:"—"}</span><span class="sp"></span><button class="btn sm" onclick="runRadar('${prof}')">Radar'ı çalıştır (~950 kota)</button></div>
  <div class="tiny faint" style="margin-top:4px">Icahn ✓ = küçük kanalda patlama (100K+ izlenme, &lt;100K abone, izlenme ≥ 5× abone): fikir videoyu taşımış demektir.</div>
  <div class="grid sec">${s.radar.map(c=>`<a class="card row" href="${esc(c.url)}" target="_blank" style="text-decoration:none;flex-wrap:nowrap">
    <img src="${esc(c.thumbnail||"")}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none" loading="lazy" alt="">
    <div style="min-width:0;flex:1"><div class="small" style="font-weight:600">${esc(c.title)}</div><div class="tiny faint">${esc(c.channel_title||"")} · ${sec(c.duration_s)} · ${(c.age_h/24).toFixed(0)} gün</div>
    <div class="row" style="gap:6px;margin-top:4px"><span class="badge">skor ${c.viral_score}</span><span class="badge">${num(c.views)} izlenme</span>${c.icahn?`<span class="badge" style="color:var(--accent)">Icahn ✓ ${c.views_per_sub}×</span>`:""}</div></div></a>`).join("")||'<div class="empty">Veri yok</div>'}</div>
  <div class="row" style="margin-top:24px"><h2 style="margin:0">Google Trends (US, GB)</h2><span class="sp"></span><button class="btn sm" onclick="runTrends()">Yenile</button></div>
  <div class="tiny faint">${s.trends_at?dt(s.trends_at):"hiç çekilmedi"} · konu ilgisi sinyali, video verisi değil</div>
  <div class="chips sec">${s.trends.map(t=>`<span class="chip">${esc(t.geo)} · ${esc(t.title)} <span class="faint">${esc(t.traffic||"")}</span></span>`).join("")}</div>`;
}
async function runRadar(p){if(!confirm("YouTube kotasından ~950 birim kullanılacak (günlük 10.000). Devam?"))return;try{await post("/api/radar",{profile:p});toast("Radar başladı")}catch(e){toast(e.message,1)}}
async function runTrends(){try{await post("/api/trends");toast("Trendler çekiliyor");setTimeout(route,6000)}catch(e){toast(e.message,1)}}


function viewShot(src){closeShot();const b=document.createElement("div");b.id="shotbox";
b.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:56px 12px 12px;overflow:auto";
b.innerHTML=`<button onclick="closeShot()" aria-label="Kapat" style="position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-size:24px;line-height:44px;cursor:pointer">✕</button><img src="${src}" style="max-width:100%;max-height:100%;border-radius:8px">`;
b.onclick=e=>{if(e.target===b)closeShot()};document.body.appendChild(b)}
function closeShot(){const b=document.getElementById("shotbox");if(b)b.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeShot()});
async function redirectArt(id){const n=prompt("Ne değişsin? (boş bırakırsan art director baştan araştırıp farklı bir yön dener)");if(n===null)return;await act(id,'direct',{note:n})}
async function redesign(id){const n=prompt("Neyi beğenmedin / ne istiyorsun? (boş bırakırsan Opus baştan, farklı bir tasarım yapar)");if(n===null)return;await act(id,'redesign',{note:n})}
async function viewKesif(){
  const d=await api("/api/discover");const r=d.run;
  const CAT={ai:"Yapay zekâ",tech:"Teknoloji",science:"Bilim",finance:"Finans",world:"Dünya"};
  $("#app").innerHTML=`<div class="row"><h1 style="margin:0">Keşif</h1><span class="sp"></span><button class="btn sm" onclick="runDiscover()">Şimdi tara</button></div>
  <div class="tiny faint" style="margin-top:4px">${r?`Son tarama ${dt(r.at)} · ${r.items} haber → ${r.candidates} aday → ${r.cards} kart · $${(r.cost_usd||0).toFixed(2)}${r.note?" · "+esc(r.note):""}`:"Henüz tarama yok"} · her sabah otomatik · kredi harcamaz, kart seçince konu araştırması (Claude) başlar, ses onayı ayrıca istenir</div>
  <div class="grid sec">${d.cards.map(c=>`<div class="card" style="${c.status==="skipped"?"opacity:.45":""}">
    <div class="row" style="gap:6px"><span class="badge">${CAT[c.category]||esc(c.category)}</span><span class="badge">skor ${(c.score||0).toFixed(1)}</span><span class="badge">${(c.signals||{}).source_count||1} kaynak</span>${(c.flags||[]).map(f=>`<span class="badge" style="color:var(--bad)">${esc(f)}</span>`).join("")}</div>
    <div style="font-weight:600;margin-top:8px">${esc(c.title)}</div>
    <div class="small" style="margin-top:4px">“${esc(c.hook)}”</div>
    <div class="tiny muted" style="margin-top:6px">${(c.beats||[]).map(esc).join(" → ")}</div>
    <div class="tiny muted" style="margin-top:4px">Görsel: ${esc(c.visual_idea)}</div>
    <div class="tiny faint" style="margin-top:4px">Neden şimdi: ${esc(c.why_now)}</div>
    <div class="tiny" style="margin-top:6px">${(c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank">${esc(s.source)}</a>`).join(" · ")}</div>
    <div class="row" style="margin-top:10px">${c.status==="picked"?'<span class="badge">seçildi · Pano\'da</span>':c.status==="skipped"?'<span class="tiny faint">geçildi</span>':`<button class="btn primary sm" onclick="pickCard(${c.card_id})">Bunu üret</button><button class="btn sm" onclick="skipCard(${c.card_id})">Geç</button>`}</div></div>`).join("")||'<div class="empty">Kart yok. “Şimdi tara” ile başlat.</div>'}</div>`;
}
async function runDiscover(){try{await post("/api/discover/run");toast("Tarama başladı (~2 dk)");setTimeout(route,90000)}catch(e){toast(e.message,1)}}
async function pickCard(id){try{const r=await post("/api/discover/card/"+id+"/pick",{});toast("Araştırma + senaryo başladı (#"+r.job_id+")");location.hash="#/"}catch(e){toast(e.message,1)}}
async function skipCard(id){try{await post("/api/discover/card/"+id+"/skip");route()}catch(e){toast(e.message,1)}}

async function viewButce(){
  const [b,u]=await Promise.all([api("/api/budget"),api("/api/claude_usage").catch(()=>null)]);const pct=Math.min(100,b.spent/b.cap*100);
  const kinds=Object.entries(b.by_kind).sort((a,c)=>c[1]-a[1]);const mx=Math.max(1,...kinds.map(k=>k[1]));
  const KT={tts:"Ses (TTS)",music:"Müzik",sfx:"Efekt",image:"Görsel",video:"AI video"};
  $("#app").innerHTML=`<h1>Bütçe</h1>
  <div class="card kpi"><div class="l">ElevenLabs bu ay</div><div class="v">${num(b.spent)} <span class="muted small">/ ${num(b.cap)} kredi · kalan ${num(b.cap-b.spent)}</span></div><div class="bar" style="height:10px"><i style="width:${pct}%"></i></div>
  <div class="tiny faint" style="margin-top:8px">Kural kodda kilitli: onaylanmış kredi miktarı olmadan ya da tahmin onayı %15'ten fazla aşarsa ya da aylık tavan aşılacaksa üretim çağrısı hiç başlamaz.</div></div>
${u?claudeUsage(u):""}
  <h2>Türe göre (bu ay)</h2><div class="card grid" style="gap:10px">${kinds.map(([k,v])=>`<div><div class="row small"><span>${KT[k]||k}</span><span class="sp"></span><b>${num(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${k==="video"?"var(--bad)":"var(--accent)"}"></i></div></div>`).join("")||'<div class="muted small">Bu ay harcama yok</div>'}</div>
  <h2>Ölçülen fiyatlar</h2><div class="card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr><th>Model</th><th class="num">Fiyat</th><th>Birim</th><th class="num">Ölçüm</th></tr></thead><tbody>${Object.entries(b.rates).map(([k,r])=>`<tr><td>${esc(k)}${r.note?`<div class="tiny faint">${esc(r.note)}</div>`:""}</td><td class="num">${(Math.round(r.rate*100)/100).toLocaleString("tr-TR")}</td><td>kredi/${esc(r.unit)}</td><td class="num">${r.samples}</td></tr>`).join("")}</tbody></table></div>
  <h2>Hareketler</h2><div class="card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Not</th><th class="num">Kredi</th></tr></thead><tbody>${b.ledger.map(r=>`<tr><td class="tiny">${dt(r.at)}</td><td>${KT[r.kind]||r.kind}<div class="tiny faint">${esc(r.model)}</div></td><td class="small muted">${esc(r.note||"")}</td><td class="num">${num(Math.round(r.credits))}</td></tr>`).join("")}</tbody></table></div>`;
}

function claudeUsage(u){
  const usd=v=>"$"+(Math.round(v*100)/100).toLocaleString("tr-TR",{minimumFractionDigits:2});
  const pct=v=>u.pct_per_usd?` <span class="muted small">≈ %${Math.round(v*u.pct_per_usd)} limit</span>`:"";
  const mx=Math.max(0.01,...u.by_step.map(x=>x[1]));
  return `<h2>Claude kullanımı (Content Factory)</h2>
  <div class="card grid" style="grid-template-columns:repeat(3,1fr);gap:10px">${[["Son 5 saat","5h"],["Bugün","today"],["7 gün","7d"]].map(([l,k])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${usd(u.totals[k])}${pct(u.totals[k])}</div></div>`).join("")}</div>
  <div class="tiny faint" style="margin:6px 2px">API liste fiyatı karşılığı; abonelik limitinden yer ama limit yüzdesi Anthropic tarafından verilmiyor. ${u.pct_per_usd?`Yüzde tahmini ${dt(u.calibrated_at)} ölçümüne göre.`:"Bir kez kalibre edilince (işten önce/sonra limit yüzdesi) burada tahmini limit yüzdesi de görünür."}${u.estimated?" Defterden önceki çağrılar kayıtlardan tahmini olarak aktarıldı.":""}</div>
  <h2>Bugün adıma göre</h2><div class="card grid" style="gap:10px">${u.by_step.map(([k,v])=>`<div><div class="row small"><span>${esc(k)}</span><span class="sp"></span><b>${usd(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join("")||'<div class="muted small">Bugün Claude çağrısı yok</div>'}
  <div class="tiny faint">Model: ${Object.entries(u.by_model).map(([k,v])=>`${k} ${usd(v)}`).join(" · ")||"—"}</div></div>
  ${u.by_prod.length?`<h2>Videoya göre (7 gün)</h2><div class="card" style="padding:4px 8px"><table><tbody>${u.by_prod.map(([id,n,v])=>`<tr><td><a href="#/p/${id}">${esc(n)}</a></td><td class="num">${usd(v)}</td></tr>`).join("")}</tbody></table></div>`:""}
  <h2>Son Claude çağrıları</h2><div class="card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr><th>Saat</th><th>Adım</th><th>Model</th><th class="num">Token</th><th class="num">$</th></tr></thead><tbody>${u.recent.map(r=>`<tr><td class="tiny">${dt(r.at)}</td><td>${esc(r.step)}${r.prod_id?` <span class="tiny faint">#${r.prod_id}</span>`:""}${r.ok?"":' <span class="tiny" style="color:var(--bad)">hata</span>'}</td><td class="small">${r.model}</td><td class="num tiny">${num(r.tokens)}</td><td class="num">${usd(r.cost)}${r.live?"":'<span class="tiny faint">*</span>'}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------------- router ----------------
async function jobPill(){try{const j=await api("/api/jobs");const run=j.filter(x=>x.status==="running"||x.status==="queued");const el=$("#jobpill");el.className="jobpill"+(run.length?" on":"");el.innerHTML=run.length?`<span class="spin"></span> ${run.length} iş sürüyor`:"işler: boşta"}catch(e){}}
async function route(){
  if(!ME)loadMe();
  clearTimeout(timer);
  const h=location.hash||"#/";const path=h.split("?")[0];
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")===path||(path.startsWith("#/p/")&&a.getAttribute("href")==="#/hat")));
  try{
    if(!FORMATS.length)FORMATS=await api("/api/formats");
    if(!STYLES.length)STYLES=await api("/api/styles").catch(()=>[]);
    const m=path.match(/^#\/p\/(\d+)/);
    if(m)await viewProd(m[1]);
    else await ({"#/":viewPano,"#/uret":viewUret,"#/hat":viewHat,"#/takip":viewTakip,"#/videolar":viewVideolar,"#/akislar":viewAkislar,"#/sinyal":viewSinyal,"#/kesif":viewKesif,"#/butce":viewButce,"#/yerler":viewYerler,"#/referanslar":viewReferanslar,"#/ses":viewSes,"#/hesaplar":viewHesaplar}[path]||viewPano)();
  }catch(e){$("#app").innerHTML=`<div class="card errbox">Yüklenemedi: ${esc(e.message)}</div>`}
  jobPill();
}
let lastHash=null;
window.addEventListener("hashchange",()=>{if(location.hash!==lastHash){lastHash=location.hash;window.scrollTo(0,0);route()}});
setInterval(jobPill,8000);
route();
</script>
