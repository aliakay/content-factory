# JSON Schemas of the canonical stage outputs (artifacts). A stage agent hands its output in through the
# submit_artifact tool, which validates it against the schema named by the stage's `artifact`; the next stage reads
# it as its contract. Keep the required core small; agents may add fields.
# User-facing summaries (`summary`) are written in the creator's interface language; content that ends up in the
# video (script lines, captions, on-screen text) is in the project's video language.

research:
  type: object
  required: [insight, sources, data_points, angles, summary]
  properties:
    insight: {type: string, minLength: 10}
    misconception: {type: string}
    sources:
      type: array
      minItems: 3
      items: {type: object, required: [url, title], properties: {url: {type: string, pattern: "^https?://"}, title: {type: string}}}
    data_points:
      type: array
      minItems: 1
      items: {type: object, required: [claim, source], properties: {claim: {type: string}, value: {type: string}, source: {type: string}}}
    angles:
      type: array
      minItems: 2
      items: {type: object, required: [title, grounded_in], properties: {title: {type: string}, grounded_in: {type: string}}}
    visual_refs: {type: array, items: {type: string}}
    summary: {type: string}

proposal:
  type: object
  required: [concepts, chosen, seconds, look, cost, summary]
  properties:
    concepts:
      type: array
      minItems: 3
      items:
        type: object
        required: [id, title, hook, structure, look]
        properties: {id: {type: string}, title: {type: string}, hook: {type: string}, structure: {type: string},
                     look: {type: string}, why: {type: string}, key_frame: {type: string}}
    chosen: {type: string}
    seconds: {type: number, minimum: 8, maximum: 600}
    look: {type: string}
    voice: {type: object}
    music: {type: object}
    cost:
      type: object
      required: [credits, lines]
      properties: {credits: {type: number, minimum: 0}, usd: {type: number}, lines: {type: array}}
    render_time: {type: object}
    summary: {type: string}

script:
  type: object
  required: [title, hook, lines, claims, summary]
  properties:
    title: {type: string}
    hook: {type: string}
    lines: {type: array, minItems: 2, items: {type: string, minLength: 1}}
    claims:
      type: array
      items: {type: object, required: [text, verified], properties: {text: {type: string}, verified: {type: boolean},
                                                                        source: {type: string}}}
    caption: {type: string}
    narrate: {type: boolean}          # false: music-led on-screen beats, no voice, no captions
    holds: {type: array, items: {type: number, minimum: 0.6, maximum: 12}}   # seconds per line when narrate is false
    summary: {type: string}

long_script:                         # long_explainer: the script plus its chapters (factory/hat/longform.py)
  type: object
  required: [title, hook, lines, chapters, claims, summary]
  properties:
    title: {type: string}
    hook: {type: string}
    lines: {type: array, minItems: 12, items: {type: string, minLength: 1}}
    chapters:                        # each chapter opens on its own short title line, read by the narrator
      type: array
      minItems: 3
      maxItems: 9
      items: {type: object, required: [title, line], properties: {title: {type: string, minLength: 2, maxLength: 48},
                                                                   line: {type: integer, minimum: 1}}}
    claims:
      type: array
      items: {type: object, required: [text, verified], properties: {text: {type: string}, verified: {type: boolean},
                                                                        source: {type: string}}}
    caption: {type: string}
    summary: {type: string}

outline:                             # long_explainer: the design system and every scene's brief, before any HTML
  type: object
  required: [concept, palette, kit, scenes, summary]
  properties:
    concept: {type: string}
    palette: {type: object}
    global_css: {type: string}
    kit: {type: string, minLength: 40}   # the shared components every scene builder reuses (titles, figures, labels, charts)
    scenes:
      type: array
      minItems: 4
      items:
        type: object
        required: [id, lines, brief]
        properties: {id: {type: string, pattern: "^[a-z][a-z0-9_-]*$"}, lines: {type: array, minItems: 2, maxItems: 2,
                                                                          items: {type: integer, minimum: 0}},
                     brief: {type: string, minLength: 10}, device: {type: string}, trigger: {type: string}}
    summary: {type: string}

scene_part:                          # long_explainer: one builder's scenes (one chapter, or the intro)
  type: object
  required: [scenes, summary]
  properties:
    scenes:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, lines, html]
        properties: {id: {type: string}, lines: {type: array, minItems: 2, maxItems: 2, items: {type: integer, minimum: 0}},
                     trigger: {type: string}, html: {type: string}, css: {type: string}, js: {type: string},
                     notes: {type: string}, mechanism: {type: string}}
    stock: {type: array}
    summary: {type: string}

scene_plan:
  type: object
  required: [concept, palette, scenes, summary]
  properties:
    concept: {type: string}
    palette: {type: object}
    global_css: {type: string}
    scenes:
      type: array
      minItems: 2
      items:
        type: object
        required: [id, lines, html]
        properties: {id: {type: string, pattern: "^[a-z][a-z0-9_-]*$"}, lines: {type: array, minItems: 2, maxItems: 2,
                                                                          items: {type: integer, minimum: 0}},
                     trigger: {type: string}, html: {type: string}, css: {type: string}, js: {type: string},
                     notes: {type: string}, mechanism: {type: string}}
    stock: {type: array}
    summary: {type: string}

animatic:                            # the draft render a creator approves before any voice or music is paid for
  type: object
  required: [file, duration, summary]
  properties:
    file: {type: string}
    duration: {type: number, minimum: 0}
    fps: {type: integer, minimum: 1}
    timing: {type: string}
    scenes:
      type: array
      items:
        type: object
        required: [id, start, end, seconds]
        properties: {id: {type: string}, start: {type: number}, end: {type: number}, seconds: {type: number},
                     spoken: {type: number}, lines: {type: array, items: {type: integer}}, words: {type: integer},
                     wps: {type: number}, flags: {type: array, items: {type: string}}}
    flags:
      type: array
      items:
        type: object
        required: [level, code, message]
        properties: {level: {type: string, enum: [warn, info]}, code: {type: string},
                     scene: {type: ["string", "null"]}, message: {type: string}}
    motion: {type: object}
    summary: {type: string}

publish:
  type: object
  required: [caption, hashtags, summary]
  properties:
    caption: {type: string, minLength: 5}
    hashtags: {type: array, minItems: 1, items: {type: string, pattern: "^#"}}
    notes: {type: string}
    summary: {type: string}

shot_list:                          # cinematic: own clips and generated shots, in play order
  type: object
  required: [title, shots, summary]
  properties:
    title: {type: string}
    shots:
      type: array
      minItems: 2
      items:
        type: object
        required: [n, kind]
        properties: {n: {type: integer}, kind: {enum: [own, gen]}, clip_id: {type: string}, in: {type: number},
                     out: {type: number}, frame: {type: string}, prompt: {type: string}, seconds: {type: number},
                     model: {type: string}, text: {type: string}, shows: {type: string}}
    seconds: {type: number}
    cost: {type: object}
    summary: {type: string}
