  tr: "Uzun bir video ya da ses dosyası ve kaç klip istediğin."
  en: "A long video or audio file and how many clips you want."
cost:
  tr: "Kredi gerekmez; transkript yerelde yapılır."
  en: "No credits; transcription runs locally."
