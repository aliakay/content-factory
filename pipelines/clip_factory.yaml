  tr: "Yayın, sunum ya da röportajdan en güçlü anlar bulunur, puanlanır; her biri kendi kancası, kadrajı ve altyazısıyla bağımsız bir kısa video olur."
  en: "The strongest moments of a stream, talk or interview are found and ranked; each becomes its own short with a hook, framing and captions."
