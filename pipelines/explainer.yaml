id: explainer
order: 1
status: ready            # ready | partial | planned
category: generated
inputs: [topic]
duration: [28, 90]       # seconds a typical video runs

name: {tr: Konu anlatımı, en: Explainer}
tagline:
  tr: "Bir konu ver, araştırılmış ve seslendirilmiş bir anlatım videosu al."
  en: "Give a topic, get a researched, narrated explainer."
makes:
  tr: "Çekim gerektirmeyen, kaynaklara dayalı 30–90 saniyelik anlatım videosu: seslendirme, kodla çizilmiş hareketli grafikler, kinetik altyazı ve ses tasarımı."
  en: "A 30–90 second, source-backed explainer that needs no footage: narration, code-drawn motion graphics, kinetic captions and sound design."
good_for:
  tr: ["Haber açıklamaları (\"ne oldu, neden önemli\")", "\"Neden / nasıl\" soruları", "Veri ve karşılaştırma hikâyeleri", "Keşif kartlarından gelen konular"]
  en: ["News explainers (\"what happened, why it matters\")", "\"Why / how\" questions", "Data and comparison stories", "Topics picked from Discovery cards"]
not_for:
  tr: ["Gerçek mekân ya da kişi görüntüsü gereken hikâyeler", "Uzun belgesel anlatımlar"]
  en: ["Stories that need real places or people on screen", "Long documentary narration"]
needs:
  tr: "Bir konu cümlesi ya da bir Keşif kartı. İstersen kaynak linkleri."
  en: "A topic sentence or a Discovery card. Source links if you have them."
cost:
  tr: "Seslendirme ~500–800 ElevenLabs kredisi; müzik istenirse ek. Claude araştırma + tasarım."
  en: "Narration ~500–800 ElevenLabs credits; music extra if wanted. Claude for research + design."

stages:
  - id: research
    run: agent
    model: sonnet
    tools: [web_search, web_fetch]
    review:
      - "At least 5 sources with URLs; every data point names its source"
      - "Numbers carry their unit, date and the exact figure (no rounding without saying so)"
      - "At least 3 genuinely different angles, each grounded in a finding"
      - "States the one insight the video must land and the common misconception"

  - id: proposal
    gate: true
    run: agent
    model: opus
    tools: [read_artifact, catalog, memory, estimate_cost, render_time]
    review:
      - "Three concepts that differ in structure, hook and look, not just wording"
      - "Every concept is grounded in the research, not generic"
      - "The chosen concept names its hook, duration, look, voice and music plan"
      - "Cost is itemised from the estimate tool, never guessed"

  - id: script
    gate: true
    run: agent
    model: opus
    tools: [read_artifact, web_search, web_fetch, proof_check, words_check, cold_test]
    review:
      - "Word count fits the approved duration within 10% (Turkish ~2.4 words/s, English ~2.6)"
      - "Hook in the first line; arc hook -> setup -> turn -> landing; a question or CTA at the end"
      - "Every factual claim is marked verified with a source, or removed"
      - "Numbers are written the way the narrator should say them"
      - "words_check has no open findings: no dashes, no stock phrasing, no greeting"
      - "The hook rule holds: line 1 lands in 3 s, is concrete and shares the title's subject"
      - "The cold test passes: a stranger's one sentence about the lines is the title's subject"

  - id: direction
    gate: true
    run: code
    call: factory.hat.direction:run
    review:
      - "One look: palette, type pairing and four rules taken from the chosen style or a stable scheme"
      - "Every scene will be drawn in this board; a note naming colours or a font redraws it"

  - id: scene_plan
    gate: true
    run: agent
    model: opus
    tools: [read_artifact, catalog, recipes, stock_search, render_stills, layout_lint, contact_sheet, proof_check, rhythm_check, subject_check, originality_check]
    review:
      - "Scenes cover the whole script with no gaps; every scene has a trigger word"
      - "No two consecutive scenes use the same visual device"
      - "rhythm_check is clean: scene lengths vary with the idea (spread >= 0.30, no run of five alike)"
      - "Each scene's motion follows the beats of its named mechanism, and every motion verb keeps one meaning (motion grammar)"
      - "Layout lint has no errors; no text sits under the caption band"
      - "The repeated-render determinism check gives identical frames"
      - "Every on-screen number matches the script and the research"
      - "Every scene names its camera (move, seconds, easing, target) and its `shows` (subject + action)"
      - "No stock metaphor stands in for the idea; originality_check scores distinct and the board's palette/type are kept"

  - id: animatic
    gate: true
    run: code
    call: factory.hat.animatic:run
    review:
      - "The whole film at draft timing: half size, 15 fps, silent but for the click track; no credits spent"
      - "Every scene is long enough to register and short enough for its one idea"
      - "Every script line is shown by a scene; no scene reads faster than the voice can speak"
      - "The picture moves in the first two seconds and never sits still for long"

  - id: assets
    gate: true
    run: code
    call: factory.hat.explainer:assets
    tools: [tts, align_words, music, preview_render]
    review:
      - "Voice duration fits the plan; alignment found every trigger word"
      - "Spend stays inside the approved budget"

  - id: edit
    run: code
    call: factory.hat.explainer:edit
    tools: [compile_bundle]

  - id: compose
    run: code
    call: factory.hat.explainer:compose
    tools: [final_render, qa_technical, qa_sound, thumbnails, deliver]

  - id: publish
    gate: true
    run: agent
    model: sonnet
    tools: [read_artifact, proof_check, safe_area, attribution]
    review:
      - "Caption in the video's language, under 150 characters, ends with a question"
      - "3–5 hashtags that match the topic"
      - "`credits` is the attribution tool's block verbatim; no asset is unlicensed"
