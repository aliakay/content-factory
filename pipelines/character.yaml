id: character
order: 10
status: ready
category: generated
inputs: [story]
duration: [30, 120]
name: {tr: Karakter animasyonu, en: Character animation}
tagline:
  tr: "Tekrar kullanılabilir çizgi karakterlerle hikâyeler."
  en: "Stories told with reusable cartoon characters."
makes:
  tr: "Karakter tasarımı, poz kütüphanesi ve sahne sahne oyunculukla çizgi animasyon; aynı karakterler her bölümde aynı görünür."
  en: "Cartoon animation with character design, a pose library and scene-by-scene acting; the same characters look the same in every episode."
good_for:
  tr: ["Seriler ve maskot içerikler", "Çocuk ve eğitim hikâyeleri"]
  en: ["Series and mascot content", "Children's and educational stories"]
not_for:
  tr: ["Gerçekçi insan sahneleri"]
  en: ["Realistic human scenes"]
needs:
  tr: "Bir hikâye ya da seri fikri."
  en: "A story or series idea."
cost:
  tr: "Karakter ve sahne çizimleri görsel başına kredi; seslendirme ek."
  en: "Character and scene art costs credits per image; narration extra."
stages:
  - id: proposal
    gate: true
    run: code
    schema: proposal_code
    call: factory.hat.character:proposal

  - id: script
    gate: true
    run: code
    call: factory.hat.character:script

  - id: character_design
    gate: true
    run: code
    call: factory.hat.character:character_design

  - id: rig_plan
    run: code
    call: factory.hat.character:rig_plan

  - id: scene_plan
    gate: true
    artifact: plates
    run: code
    call: factory.hat.character:scene_plan

  - id: assets
    gate: true
    run: code
    call: factory.hat.character:assets

  - id: edit
    run: code
    call: factory.hat.character:edit

  - id: compose
    run: code
    call: factory.hat.character:compose

  - id: publish
    gate: true
    run: code
    call: factory.hat.character:publish
